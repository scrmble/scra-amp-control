name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable
        # --windowed: Creates a GUI application without console window
        run: |
          pyinstaller --onefile --windowed --name "PowerAmplifierControl" power_amp_user_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerAmplifierControl-Windows
          path: dist/PowerAmplifierControl.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PowerAmplifierControl.exe
          generate_release_notes: true
